<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Log in · SchuLyf</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        },
                        colors: {
                            primary: {
                                50: '#ecfdf5',
                                100: '#d1fae5',
                                200: '#a7f3d0',
                                300: '#6ee7b7',
                                400: '#34d399',
                                500: '#10b981',
                                600: '#059669',
                                700: '#047857',
                                800: '#065f46',
                                900: '#064e3b',
                                950: '#022c22',
                            },
                        },
                        borderRadius: { xl: '0.875rem' },
                    },
                },
            };
        </script>
        <link rel="stylesheet" href="assets/app.css" />
    </head>
    <body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
        <main class="grid min-h-screen lg:grid-cols-2">
            <!-- ===== BRAND PANEL (left on desktop, slim header on mobile) ===== -->
            <section
                class="relative overflow-hidden bg-primary-700 text-white lg:flex lg:flex-col lg:justify-between lg:p-12"
            >
                <div class="brand-glow absolute inset-0 opacity-90"></div>
                <div class="brand-pattern absolute inset-0"></div>

                <!-- Mobile: slim branded strip -->
                <div
                    class="relative flex items-center gap-2.5 px-5 py-4 lg:hidden"
                >
                    <span
                        class="grid size-9 place-items-center rounded-xl bg-white/15 ring-1 ring-white/25"
                    >
                        <svg viewBox="0 0 32 32" class="size-5" aria-hidden="true">
                            <path
                                d="M16 3 3 9l13 6 10-4.6V20h2.6V9L16 3Z"
                                fill="#fff"
                            />
                            <path
                                d="M7 14.4V20c0 2.6 4 4.8 9 4.8s9-2.2 9-4.8v-5.6l-9 4.1-9-4.1Z"
                                fill="#fff"
                                opacity=".7"
                            />
                        </svg>
                    </span>
                    <span class="text-lg font-extrabold tracking-tight"
                        >SchuLyf</span
                    >
                </div>

                <!-- Desktop: full brand content -->
                <div class="relative hidden lg:block">
                    <div class="flex items-center gap-3">
                        <span
                            class="grid size-11 place-items-center rounded-xl bg-white/15 ring-1 ring-white/25"
                        >
                            <svg
                                viewBox="0 0 32 32"
                                class="size-6"
                                aria-hidden="true"
                            >
                                <path
                                    d="M16 3 3 9l13 6 10-4.6V20h2.6V9L16 3Z"
                                    fill="#fff"
                                />
                                <path
                                    d="M7 14.4V20c0 2.6 4 4.8 9 4.8s9-2.2 9-4.8v-5.6l-9 4.1-9-4.1Z"
                                    fill="#fff"
                                    opacity=".7"
                                />
                            </svg>
                        </span>
                        <span class="text-2xl font-extrabold tracking-tight"
                            >SchuLyf</span
                        >
                    </div>
                </div>

                <div class="relative hidden max-w-md lg:block">
                    <h1
                        class="text-4xl font-extrabold leading-tight tracking-tight"
                    >
                        Your campus life,<br />organized.
                    </h1>
                    <ul class="mt-8 space-y-4 text-primary-50">
                        <li class="flex items-start gap-3">
                            <span
                                class="mt-0.5 grid size-6 flex-none place-items-center rounded-full bg-white/15"
                            >
                                <i data-lucide="check" class="size-3.5"></i>
                            </span>
                            <span>Apply &amp; track admission</span>
                        </li>
                        <li class="flex items-start gap-3">
                            <span
                                class="mt-0.5 grid size-6 flex-none place-items-center rounded-full bg-white/15"
                            >
                                <i data-lucide="check" class="size-3.5"></i>
                            </span>
                            <span>Pay &amp; verify receipts</span>
                        </li>
                        <li class="flex items-start gap-3">
                            <span
                                class="mt-0.5 grid size-6 flex-none place-items-center rounded-full bg-white/15"
                            >
                                <i data-lucide="check" class="size-3.5"></i>
                            </span>
                            <span>Results, attendance &amp; more</span>
                        </li>
                    </ul>
                </div>

                <p class="relative hidden text-sm text-primary-100/80 lg:block">
                    © 2026 SchuLyf · Student Management System
                </p>
            </section>

            <!-- ===== FORM PANEL ===== -->
            <section class="flex items-center justify-center px-5 py-10 sm:px-8">
                <div class="w-full max-w-sm">
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold tracking-tight">
                            Welcome back
                        </h2>
                        <p
                            class="mt-1 text-sm text-slate-500 dark:text-slate-400"
                        >
                            Sign in to your account
                        </p>
                    </div>

                    <form class="space-y-5" onsubmit="window.location.href='dashboard.html';return false;">
                        <!-- Username -->
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <label
                                    for="email"
                                    class="text-sm font-medium text-slate-700 dark:text-slate-200"
                                    >Username</label
                                >
                                <span class="group relative inline-flex">
                                    <button
                                        type="button"
                                        class="grid place-items-center rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                                        aria-describedby="username-hint"
                                    >
                                        <i data-lucide="info" class="size-3.5"></i>
                                        <span class="sr-only"
                                            >What can I use as a username?</span
                                        >
                                    </button>
                                    <span
                                        id="username-hint"
                                        role="tooltip"
                                        class="pointer-events-none absolute left-1/2 top-full z-10 mt-1.5 w-44 -translate-x-1/2 rounded-lg bg-slate-900 px-2.5 py-1.5 text-center text-xs text-white opacity-0 shadow-lg transition group-hover:opacity-100 group-focus-within:opacity-100 dark:bg-slate-700"
                                    >
                                        Email, employee ID, or matricule
                                    </span>
                                </span>
                            </div>
                            <input
                                id="email"
                                name="email"
                                type="text"
                                required
                                autofocus
                                autocomplete="username"
                                placeholder="you@school.edu · EMP-001 · 22A001"
                                class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500"
                            />
                        </div>

                        <!-- Password -->
                        <div class="space-y-2">
                            <label
                                for="password"
                                class="text-sm font-medium text-slate-700 dark:text-slate-200"
                                >Password</label
                            >
                            <div class="relative">
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    required
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 pr-11 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500"
                                />
                                <button
                                    type="button"
                                    data-password-toggle="password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                    class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                                >
                                    <i data-icon-eye data-lucide="eye" class="size-4"></i>
                                    <i
                                        data-icon-eye-off
                                        data-lucide="eye-off"
                                        class="size-4"
                                        hidden
                                    ></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <label
                                class="flex cursor-pointer items-center gap-2.5 text-sm text-slate-600 dark:text-slate-300"
                            >
                                <input
                                    type="checkbox"
                                    name="remember"
                                    class="size-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500/40 dark:border-slate-600 dark:bg-slate-800"
                                />
                                <span>Remember me</span>
                            </label>
                            <a
                                href="#"
                                class="text-sm font-medium text-primary-700 hover:text-primary-800 hover:underline dark:text-primary-400"
                                >Forgot password?</a
                            >
                        </div>

                        <button
                            type="submit"
                            class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-700 active:bg-primary-800"
                        >
                            Log in
                        </button>
                    </form>

                    <p
                        class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400"
                    >
                        Don't have an account?
                        <a
                            href="register.html"
                            class="font-semibold text-primary-700 hover:underline dark:text-primary-400"
                            >Sign up</a
                        >
                    </p>

                    <!-- Theme toggle (auth screens have no app shell) -->
                    <div class="mt-10 flex justify-center">
                        <button
                            type="button"
                            data-theme-toggle
                            aria-pressed="false"
                            class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800"
                        >
                            <i data-icon-sun data-lucide="sun" class="size-3.5"></i>
                            <i data-icon-moon data-lucide="moon" class="size-3.5" hidden></i>
                            <span>Toggle theme</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="assets/app.js"></script>
    </body>
</html>
